name: Appearance Studio Public Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verified-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check source and media manifest
        run: python3 -B .github/scripts/release_audit.py
      - name: Transaction and system monitor regressions
        env:
          PYTHONPATH: src
        run: |
          python3 -B tests/test_engine_transaction.py
          python3 -B tests/test_system_monitor_model.py
          python3 -B tests/test_install_preflight.py
          python3 -B tests/test_upgrade_from_published_core.py
      - name: Build and verify reproducible unsigned PR canary
        shell: bash
        run: |
          python3 -B .github/scripts/build_candidate.py \
            --output-dir "$RUNNER_TEMP/appearance-core-candidate" --smoke-test
      - name: Retain PR canary for review, not as a GitHub Release
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: appearance-core-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/appearance-core-candidate/
          if-no-files-found: error
          retention-days: 7
  gtk-broadway-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 Broadway smoke-test prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin libglib2.0-bin gsettings-desktop-schemas
      - name: Construct and render UI on isolated localhost Broadway
        run: /usr/bin/python3 -B tests/test_ui_broadway.py
      - name: Apply real GNOME keyfile Dark/Light and verify rollback in temporary home
        run: /usr/bin/python3 -B tests/test_gsettings_keyfile.py
